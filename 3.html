<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantilla Web Mejorada</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Fuente ligeramente más moderna */
        }

        body {
            background-color: #f4f4f9;
            color: #333;
            line-height: 1.6;
        }

        /* Encabezado */
        header {
            background-color: #2c3e50;
            color: white;
            padding: 2rem;
            text-align: center;
        }

        /* Contenedor principal */
        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Banner Principal (Hero) - Ahora con la imagen de fondo */
        .hero {
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTDEMmLfPnhCRdOxqcMJb6-0NzY0OK-ObVUu_P1DVyZmg&s=10');
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            padding: 4rem 2rem; /* Más padding para que se vea la imagen */
            text-align: center;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); /* Sombra para destacar el banner */
            position: relative;
        }

        /* Superposición oscura para que el texto sobre la imagen hero sea legible */
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.4); /* Capa negra traslúcida */
            border-radius: 8px;
        }

        /* Asegurar que el contenido del hero esté sobre la superposición */
        .hero-content {
            position: relative;
            z-index: 1;
        }

        /* Rejilla de Contenido */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        /* Tarjetas de información */
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s; /* Efecto suave al pasar el ratón */
        }

        .card:hover {
            transform: translateY(-5px); /* Se levanta un poco al hacer hover */
        }

        /* Espacio para Imágenes MEJORADO (Placeholders en tarjetas) */
        .img-placeholder {
            width: 100%;
            height: 200px;
            background-color: #e2e8f0; /* Fondo gris claro */
            border: 2px solid #cbd5e1; /* Borde gris */
            border-radius: 6px;
            display: flex;
            flex-direction: column; /* Icono arriba, texto abajo */
            align-items: center;
            justify-content: center;
            color: #94a3b8; /* Color de texto suave */
            margin-bottom: 1rem;
            position: relative;
            overflow: hidden;
        }

        /* Simulación de un icono de imagen dentro del placeholder */
        .img-placeholder::before {
            content: '📷'; /* Icono de cámara simple */
            font-size: 3rem;
            margin-bottom: 0.5rem;
            opacity: 0.5;
        }

        .img-placeholder-text {
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }


        /* Bloques vacíos para texto */
        .text-placeholder {
            background-color: #f1f5f9;
            border-radius: 4px;
            height: 1rem;
            margin-bottom: 0.75rem;
        }

        .text-placeholder.title {
            height: 1.5rem;
            width: 60%;
            background-color: #e2e8f0;
            margin-bottom: 1rem;
        }

        .text-placeholder.short {
            width: 40%;
        }

        /* Pie de página */
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 1.5rem;
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>[ TÍTULO DE LA PÁGINA ]</h1>
        <p>[ Subtítulo o descripción breve ]</p>
    </header>

    <main class="container">
        
        <!-- Sección Principal (Hero con imagen de fondo) -->
        <section class="hero">
            <div class="hero-content">
                <!-- He añadido placeholders de texto aquí también para rellenar el banner -->
                <div class="text-placeholder title" style="background-color: #f1f5f9; margin: 0 auto 1rem auto; width: 50%;"></div>
                <div class="text-placeholder" style="background-color: #f1f5f9; width: 80%; margin: 0 auto 0.75rem auto;"></div>
                <div class="text-placeholder short" style="background-color: #f1f5f9; margin: 0 auto; width: 30%;"></div>
            </div>
        </section>

        <!-- Rejilla de Tarjetas -->
        <section class="grid">
            
            <!-- Tarjeta 1 -->
            <article class="card">
                <div class="img-placeholder">
                    <span class="img-placeholder-text">Insertar Imagen</span>
                    <span style="font-size: 0.8rem;">(Sugerido: 300x200 px)</span>
                </div>
                <div class="text-placeholder title"></div>
                <div class="text-placeholder"></div>
                <div class="text-placeholder"></div>
                <div class="text-placeholder short"></div>
            </article>

            <!-- Tarjeta 2 -->
            <article class="card">
                <div class="img-placeholder">
                    <span class="img-placeholder-text">Insertar Imagen</span>
                    <span style="font-size: 0.8rem;">(Sugerido: 300x200 px)</span>
                </div>
                <div class="text-placeholder title"></div>
                <div class="text-placeholder"></div>
                <div class="text-placeholder"></div>
                <div class="text-placeholder short"></div>
            </article>

            <!-- Tarjeta 3 -->
            <article class="card">
                <div class="img-placeholder">
                    <span class="img-placeholder-text">Insertar Imagen</span>
                    <span style="font-size: 0.8rem;">(Sugerido: 300x200 px)</span>
                </div>
                <div class="text-placeholder title"></div>
                <div class="text-placeholder"></div>
                <div class="text-placeholder"></div>
                <div class="text-placeholder short"></div>
            </article>

        </section>

    </main>

    <footer>
        <p>[ Pie de página / Información de contacto ]</p>
    </footer>

</body>
</html>
