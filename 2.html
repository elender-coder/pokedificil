<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantilla Web</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            color: #333;
            line-height: 1.6;
        }

        /* Encabezado */
        header {
            background-color: #2c3e50;
            color: white;
            padding: 2rem;
            text-align: center;
        }

        /* Contenedor principal */
        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Banner Principal */
        .hero {
            background-color: #e2e8f0;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            padding: 3rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        /* Rejilla de Contenido */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        /* Tarjetas de información */
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        /* Espacio para Imágenes (Placeholders) */
        .img-placeholder {
            width: 100%;
            height: 200px;
            background-color: #cbd5e1;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        /* Bloques vacíos para texto */
        .text-placeholder {
            background-color: #f1f5f9;
            border-radius: 4px;
            height: 1rem;
            margin-bottom: 0.75rem;
        }

        .text-placeholder.title {
            height: 1.5rem;
            width: 60%;
            background-color: #e2e8f0;
            margin-bottom: 1rem;
        }

        .text-placeholder.short {
            width: 40%;
        }

        /* Pie de página */
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 1.5rem;
            margin-top: 3rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>problematicas  </ h1>
    </header>

    <main class="container">
        
        <section class="hero">
            <div><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTDEMmLfPnhCRdOxqcMJb6-0NzY0OK-ObVUu_P1DVyZmg&s=10">
                Espacio para Imagen Principal (Banner)
            </div>
            <div class="text-placeholder title" style="margin: 0 auto 1rem auto;"></div>
            <div class="text-placeholder"></div>
            <div class="text-placeholder short" style="margin: 0 auto;"></div>
        </section>

        <section class="grid">
            
            <article class="card">
                <div class="img-placeholder">
                    Imagen 1 (300x200)
                </div>
                <div class="text-placeholder title"></div>
                <div class="text-placeholder"></div>
                <div class="text-placeholder"></div>
                <div class="text-placeholder short"></div>
            </article>

            <article class="card">
                <div class="img src=https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTDEMmLfPnhCRdOxqcMJb6-0NzY0OK-ObVUu_P1DVyZmg&s=10">
                    Imagen 2 (300x200)
                </div>
                <div class="text-placeholder title"></div>
                <div class="text-placeholder"></div>
                <div class="text-placeholder"></div>
                <div class="text-placeholder short"></div>
            </article>

            <article class="card">
                <div class="img-placeholder">
                    Imagen 3 (300x200)
                </div>
                <div class="text-placeholder title"></div>
                <div class="text-placeholder"></div>
                <div class="text-placeholder"></div>
                <div class="text-placeholder short"></div>
            </article>

        </section>

    </main>

    <footer>
        <p>[ Pie de página / Información de contacto ]</p>
    </footer>

</body>
</html>
